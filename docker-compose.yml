services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - ./.env:/var/www/html/.env
      - ./storage:/var/www/html/storage
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["8080:80"]
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
  worker:
    build: .
    restart: unless-stopped
    command: ["sh", "-c", "until [ -f storage/app/installed ]; do sleep 2; done; exec php artisan queue:work redis --queue=agents,default --sleep=1 --tries=3 --timeout=900"]
    volumes:
      - ./.env:/var/www/html/.env
      - ./storage:/var/www/html/storage
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
  scheduler:
    build: .
    restart: unless-stopped
    command: ["sh", "-c", "while true; do if [ -f storage/app/installed ]; then php artisan schedule:run --no-interaction; fi; sleep 60; done"]
    volumes:
      - ./.env:/var/www/html/.env
      - ./storage:/var/www/html/storage
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: enverif
      MYSQL_USER: enverif
      MYSQL_PASSWORD: enverif
      MYSQL_ROOT_PASSWORD: root
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  mysql_data: {}
  redis_data: {}
