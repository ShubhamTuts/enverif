name: Align 1.4.0 Standalone Version Test

on:
  push:
    branches:
      - fix/enverif-1.4-production-hardening
    paths:
      - '.github/workflows/repair-1.4-version-test.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/enverif-1.4-production-hardening
          fetch-depth: 0
      - name: Align standalone release assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/standalone/run.php')
          text = path.read_text()
          old = "assert($version === '1.3.9');"
          new = "assert($version === '1.4.0');"
          if old not in text:
              raise SystemExit(f'Missing expected stale version assertion: {old}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit aligned test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ShubhamTuts'
          git config user.email '32325895+ShubhamTuts@users.noreply.github.com'
          git add tests/standalone/run.php
          git commit -m 'test: expect Enverif 1.4.0 release version'
          git push origin HEAD:fix/enverif-1.4-production-hardening
