name: GitHub Pages

# Optional. The application repository ships Markdown docs under docs/.
# Enable this workflow only when websites/ assets are present in a docs/site fork.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Require websites packaging tree
        run: |
          test -d websites/enverif.com
          test -d websites/docs.enverif.com
          test -f scripts/build-site.php
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: php scripts/build-site.php
      - run: php scripts/check-site.php
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
