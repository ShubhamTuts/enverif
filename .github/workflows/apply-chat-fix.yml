name: Apply focused chat source patch

on:
  push:
    branches: [fix/chat-agent-sales-orchestration-20260807]
    paths: ['.github/workflows/apply-chat-fix.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/chat-agent-sales-orchestration-20260807
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact source fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          controller = Path('app/Http/Controllers/ChatController.php')
          text = controller.read_text()
          replacement = '''    /** @param array<string,mixed> $data @return array{0:?ModelConnection,1:?string} */
          private function resolveModelSelection(array $data, ?ChatThread $thread, Agent $agent): array
          {
              $threadAgentId = (int) ($thread?->default_agent_id ?: $thread?->agent_id ?: 0);
              $agentChanged = $thread !== null && $threadAgentId > 0 && $threadAgentId !== (int) $agent->id;
              $connectionSubmitted = array_key_exists('model_connection_id', $data);
              $submittedConnectionId = (int) ($data['model_connection_id'] ?? 0);

              if ($connectionSubmitted && $submittedConnectionId > 0) {
                  $connectionId = $submittedConnectionId;
              } elseif ($agentChanged || !$thread) {
                  $connectionId = (int) ($agent->model_connection_id ?: 0);
              } else {
                  $connectionId = (int) ($thread?->default_model_connection_id ?: $agent->model_connection_id ?: 0);
              }

              $connection = $connectionId > 0 ? ModelConnection::whereKey($connectionId)->where('enabled', true)->first() : null;
              if ($connectionId > 0 && !$connection) throw ValidationException::withMessages(['model_connection_id' => 'The selected model connection is unavailable in this workspace.']);
              if (!$connection) {
                  $connection = ModelConnection::where('workspace_id', $agent->workspace_id)->where('enabled', true)->first();
              }

              $modelSubmitted = array_key_exists('model', $data);
              if ($modelSubmitted) {
                  $model = trim((string) ($data['model'] ?? ''));
              } elseif ($agentChanged || !$thread) {
                  $model = trim((string) ($agent->model ?: ''));
              } else {
                  $model = trim((string) ($thread?->default_model ?: $agent->model ?: ''));
              }
              if ($model === '__custom__') {
                  $model = trim((string) ($data['custom_model'] ?? ''));
                  if ($model === '') throw ValidationException::withMessages(['custom_model' => 'Enter the custom model ID.']);
              }
              if ($model === '' && $connection) {
                  $model = $connection->default_model ?: ($this->providers->get($connection->provider)->models()[0] ?? null);
              }
              return [$connection, $model !== '' ? $model : null];
          }

          '''
          pattern = re.compile(r"    /\*\* @param array<string,mixed> \$data @return array\{0:\?ModelConnection,1:\?string\} \*/\n    private function resolveModelSelection\(.*?\n    \}\n\n(?=    /\*\* @param list<int> \$connectorIds)", re.S)
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'ChatController selection block matched {count} times')
          controller.write_text(text)

          for name in ['resources/js/app.js', 'public/assets/app.js']:
              path = Path(name)
              js = path.read_text(encoding='utf-8-sig')
              first = "        showError('');\n        setBusy(true);"
              if js.count(first) != 1:
                  raise SystemExit(f'{name} busy preamble matched {js.count(first)} times')
              js = js.replace(first, "        showError('');\n        const payload = new FormData(form);\n        setBusy(true);", 1)
              second = '                body: new FormData(form),'
              if js.count(second) != 1:
                  raise SystemExit(f'{name} FormData body matched {js.count(second)} times')
              js = js.replace(second, '                body: payload,', 1)
              path.write_text(js, encoding='utf-8')

          Path('.github/workflows/apply-chat-fix.yml').unlink()
      - name: Verify focused patch syntax and regression
        run: |
          php -l app/Http/Controllers/ChatController.php
          node --check resources/js/app.js
          node --check public/assets/app.js
          node --test tests/js/chat-composer.test.mjs
          cmp resources/js/app.js public/assets/app.js
      - name: Commit focused patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Enverif CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/Http/Controllers/ChatController.php resources/js/app.js public/assets/app.js .github/workflows/apply-chat-fix.yml
          git commit -m 'fix: preserve selected chat agent and model defaults'
          git push origin HEAD:fix/chat-agent-sales-orchestration-20260807
