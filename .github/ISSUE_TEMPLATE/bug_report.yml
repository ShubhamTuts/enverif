name: Bug report
description: Report a reproducible Enverif problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes: {label: Summary, description: What happened and what did you expect?}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Enverif version}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction steps}
    validations: {required: true}
  - type: textarea
    id: logs
    attributes: {label: Relevant logs, render: shell}
