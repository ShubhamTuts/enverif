name: Publish Verified Enverif 1.4.0

on:
  push:
    branches:
      - fix/enverif-1.4-production-hardening
    paths:
      - '.github/workflows/publish-1.4-release.yml'

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFIED_MAIN_SHA: 16257dda5d349129c44e9c5c583bc0f41bb40c91
      RELEASE_TAG: v1.4.0
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify immutable release target
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          CURRENT_MAIN="$(git rev-parse origin/main)"
          if [[ "$CURRENT_MAIN" != "$VERIFIED_MAIN_SHA" ]]; then
            echo "main moved: expected $VERIFIED_MAIN_SHA, got $CURRENT_MAIN" >&2
            exit 1
          fi
          VERSION_VALUE="$(git show "$VERIFIED_MAIN_SHA:VERSION" | tr -d '[:space:]')"
          if [[ "$VERSION_VALUE" != "1.4.0" ]]; then
            echo "Verified main does not report VERSION 1.4.0 (got $VERSION_VALUE)." >&2
            exit 1
          fi
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already exists; refusing to retarget it." >&2
            exit 1
          fi
      - name: Create immutable release tag at verified main
        shell: bash
        run: |
          set -euo pipefail
          git tag -a "$RELEASE_TAG" "$VERIFIED_MAIN_SHA" -m "Enverif 1.4.0"
          git push origin "refs/tags/$RELEASE_TAG"
      - name: Dispatch repository release workflow
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f ref="$RELEASE_TAG"
          echo "Dispatched release.yml for $RELEASE_TAG at $VERIFIED_MAIN_SHA"
