name: Dispatch Corrected Enverif 1.4.0 Release

on:
  push:
    branches:
      - fix/enverif-1.4-production-hardening
    paths:
      - '.github/workflows/dispatch-1.4-release-retry.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch corrected release workflow from main
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f ref=v1.4.0
          echo 'Dispatched corrected v1.4.0 release workflow from main.'
